[package]
name = "dg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Lightweight terminal markdown viewer with mermaid/PlantUML text diagrams"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
