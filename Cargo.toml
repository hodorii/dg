[package]
name = "dg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Lightweight terminal markdown viewer with mermaid/PlantUML text diagrams"

[lib]
name = "dg"
path = "src/lib.rs"

[[bin]]
name = "dg"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# 명령줄 도구와 페이저. 라이브러리로만 쓰면 끄면 된다(clap·crossterm이 빠진다).
cli = ["dep:clap", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
